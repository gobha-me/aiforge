name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clang-tidy:
    name: Clang Tidy 20
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Clang Tidy 20
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install --no-install-recommends clang-tidy-20 clang-tools-20

      - name: Check shipped code and suppression policy
        run: tools/lint.sh

  format:
    name: Clang Format 20
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Clang Format 20
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install --no-install-recommends clang-format-20

      - name: Check formatting
        run: tools/format.sh --check

  build-and-test:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            build_dir: build-gcc
            toolchain: ""
            cxxflags: ""
          - compiler: Clang
            build_dir: build-clang
            toolchain: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/clang.cmake
            # libc++ 18 keeps std::stop_token behind this feature gate.
            cxxflags: -stdlib=libc++ -fexperimental-library

    env:
      CXXFLAGS: ${{ matrix.cxxflags }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Clang standard library
        if: matrix.compiler == 'Clang'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libc++-18-dev libc++abi-18-dev

      - name: Configure
        run: >-
          cmake -B "${{ matrix.build_dir }}" ${{ matrix.toolchain }}
          -Daiforge_DRAWFORGE_EVALUATION=ON

      - name: Build
        run: cmake --build "${{ matrix.build_dir }}" --parallel 2

      - name: Test
        # Repeat successful tests to exercise teardown races; a failure is not
        # retried. Bound each process so CTest reports the responsible target.
        run: >-
          ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure
          --repeat until-fail:2 --timeout 120 --no-tests=error

      - name: Verify dependency consumption
        run: tools/verify-dependency-consumption.sh "${{ matrix.build_dir }}"
